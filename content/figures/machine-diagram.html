<svg class="ef-machine" viewBox="0 0 1320 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mT mD"><title id="mT">How evidence moves a probability</title><desc id="mD">Six families of development on the left, each with a count, feeding two layers in the middle, a relationship graph and a baseline of what normally follows. Both feed a single update step, which moves the probability on five dated questions listed on the right.</desc><text x="150" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#6E7B85">developments this quarter</text><text x="150" y="60" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#6E7B85">typed and placed</text><text x="560" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#6E7B85">what we hold about them</text><text x="790" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#6E7B85">the update</text><text x="1120" y="42" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#6E7B85">the questions we answer</text><text x="214.0" y="125" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Politics and repression</text><circle cx="268" cy="120" r="40.0" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="125" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">60</text><text x="225.8550406988035" y="205" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Sanctions and licences</text><circle cx="268" cy="200" r="28.1" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="205" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">20</text><text x="226.2351959247477" y="285" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Economy and prices</text><circle cx="268" cy="280" r="27.8" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="285" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">19</text><text x="227.83905625164968" y="365" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Streets and society</text><circle cx="268" cy="360" r="26.2" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="365" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">15</text><text x="228.26453166409598" y="445" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Oil and infrastructure</text><circle cx="268" cy="440" r="25.7" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="445" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">14</text><text x="229.61658565789395" y="525" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#1E1957">Foreign alignment</text><circle cx="268" cy="520" r="24.4" fill="#1E1957" fill-opacity="0.07" stroke="#1E1957" stroke-opacity="0.45" stroke-width="1.4"/><text x="268" y="525" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#1E1957">11</text><rect x="430" y="178" width="260" height="78" rx="8" fill="#FFFFFF" stroke="#1E1957" stroke-opacity="0.5" stroke-width="1.4"/><text x="560.0" y="213.0" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1E1957">Who moves with whom</text><text x="560.0" y="235.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#6E7B85">the actors and their ties</text><rect x="430" y="392" width="260" height="78" rx="8" fill="#FFFFFF" stroke="#1E1957" stroke-opacity="0.5" stroke-width="1.4"/><text x="560.0" y="427.0" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1E1957">What normally follows</text><text x="560.0" y="449.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#6E7B85">the baseline in the archive</text><path d="M300 120 C 360 120 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 120 C 360 120 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 200 C 360 200 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 200 C 360 200 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 280 C 360 280 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 280 C 360 280 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 360 C 360 360 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 360 C 360 360 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 440 C 360 440 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 440 C 360 440 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 520 C 360 520 370 217 430 217" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M300 520 C 360 520 370 431 430 431" fill="none" stroke="#1E1957" stroke-opacity="0.16" stroke-width="1.2"/><path d="M690 217 C 740 217 740 300 780 310" fill="none" stroke="#1E1957" stroke-opacity="0.3" stroke-width="2"/><path d="M690 431 C 740 431 740 330 780 320" fill="none" stroke="#1E1957" stroke-opacity="0.3" stroke-width="2"/><circle cx="836" cy="315" r="56" fill="#1E1957"/><text x="836" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#FFFFFF">Update</text><text x="836" y="330" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#CFCCE0">moves the odds</text><path d="M892 315 C 930 315 930 114 960 114" fill="none" stroke="#1E1957" stroke-opacity="0.22" stroke-width="1.2"/><text x="960" y="98" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Will the José complex lose grid power</text><text x="960" y="114" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">for more than 24 hours in any single week?</text><text x="960" y="130" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6E7B85">before 31 Mar 2027</text><rect x="960" y="138" width="140" height="7" rx="3.5" fill="#E4E2EE"/><rect x="960" y="138" width="70" height="7" rx="3.5" fill="#F25120"/><path d="M892 315 C 930 315 930 224 960 224" fill="none" stroke="#1E1957" stroke-opacity="0.22" stroke-width="1.2"/><text x="960" y="208" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Will there be a work stoppage of 48</text><text x="960" y="224" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">hours or more at Punta de Mata?</text><text x="960" y="240" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6E7B85">before 31 Mar 2027</text><rect x="960" y="248" width="140" height="7" rx="3.5" fill="#E4E2EE"/><rect x="960" y="248" width="85" height="7" rx="3.5" fill="#F25120"/><path d="M892 315 C 930 315 930 334 960 334" fill="none" stroke="#1E1957" stroke-opacity="0.22" stroke-width="1.2"/><text x="960" y="318" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Will workers or contractors at Punta de</text><text x="960" y="334" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Mata report arrears of four weeks or more?</text><text x="960" y="350" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6E7B85">before 31 Mar 2027</text><rect x="960" y="358" width="140" height="7" rx="3.5" fill="#E4E2EE"/><rect x="960" y="358" width="104" height="7" rx="3.5" fill="#F25120"/><path d="M892 315 C 930 315 930 444 960 444" fill="none" stroke="#1E1957" stroke-opacity="0.22" stroke-width="1.2"/><text x="960" y="428" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Will the terms of the Petromonagas joint</text><text x="960" y="444" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">venture be formally changed?</text><text x="960" y="460" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6E7B85">before 30 Sep 2027</text><rect x="960" y="468" width="140" height="7" rx="3.5" fill="#E4E2EE"/><rect x="960" y="468" width="49" height="7" rx="3.5" fill="#F25120"/><path d="M892 315 C 930 315 930 554 960 554" fill="none" stroke="#1E1957" stroke-opacity="0.22" stroke-width="1.2"/><text x="960" y="538" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">Will the head of PDVSA’s Oriente</text><text x="960" y="554" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#1E1957">division be replaced?</text><text x="960" y="570" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6E7B85">before 31 Mar 2027</text><rect x="960" y="578" width="140" height="7" rx="3.5" fill="#E4E2EE"/><rect x="960" y="578" width="56" height="7" rx="3.5" fill="#F25120"/></svg>
  <figcaption>Developments are typed and placed, checked against who the actors are and what normally follows, and then one update step moves the probability on each open question. Nothing else moves a probability, and every movement can be traced back to the developments that caused it.</figcaption>
</figure>
