# Packaging template: ships as render.yaml with a prebuilt public/ directory.
services:
  - type: web
    name: echoframe-team-preview
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT preview_server:app
    healthCheckPath: /_health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: PREVIEW_USERNAME
        value: team
      - key: PREVIEW_PASSWORD
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
