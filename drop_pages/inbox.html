<script>
var token = '';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function when(iso) { var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(); }
function load() {
  fetch('/drop/api/list', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) {
    if (r.status === 401) { location.href = '/drop/login'; return null; }
    return r.json();
  }).then(function (data) {
    if (!data) return;
    token = data.token;
    var box = document.getElementById('list');
    document.getElementById('deleteAll').hidden = !data.files.length;
    if (!data.files.length) { box.innerHTML = '<div class="empty">Nothing has been sent yet.</div>'; return; }
    box.innerHTML = data.files.map(function (f) {
      return '<div class="row"><div><b>' + esc(f.documents) + ' redacted documents</b><span>Received ' + esc(when(f.received)) + ' · ' + esc(size(f.bytes)) + '</span></div>' +
        '<a class="btn primary" href="/drop/api/file/' + encodeURIComponent(f.id) + '">Download</a>' +
        '<button class="btn danger" data-id="' + esc(f.id) + '">Delete</button></div>';
    }).join('');
  }).catch(function () { document.getElementById('status').textContent = 'Could not load the list. Check the connection and refresh.'; });
}
function remove(body, message) {
  fetch('/drop/api/delete', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Drop-Token': token }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) { document.getElementById('status').textContent = d.ok ? message : (d.error || 'That did not work.'); load(); })
    .catch(function () { document.getElementById('status').textContent = 'That did not work. Refresh and try again.'; });
}
var armed = null;
document.getElementById('list').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-id]');
  if (!b) return;
  if (armed !== b) { armed = b; b.textContent = 'Press again to delete'; return; }
  remove({ id: b.getAttribute('data-id') }, 'Deleted.');
});
document.getElementById('deleteAll').addEventListener('click', function () {
  var b = this;
  if (armed !== b) { armed = b; b.textContent = 'Press again to delete everything'; return; }
  armed = null; b.textContent = 'Delete everything';
  remove({ all: true }, 'Everything has been deleted from the server.');
});
document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
