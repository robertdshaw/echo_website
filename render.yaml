services:
  - type: web
    name: echoframe-website
    runtime: python
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python scripts/build.py
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /api/contact/status
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: CONTACT_TO
        value: contact@echoframe.co
      - key: CONTACT_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: BUREAU_USERS
        sync: false
      # Secure drop. Off until set in the dashboard as sender-name:password,owner-name:password
      - key: DROP_USERS
        sync: false
      # Optional. The sender's own firm as name,email-domain so it is never taken for a client.
      - key: DROP_FIRM
        sync: false
      # Optional. Alert when a drop arrives: an ntfy.sh topic URL (phone) or an email address.
      - key: DROP_NOTIFY
        sync: false
      - key: TRUST_PROXY
        value: "true"
